name: Downstream CI

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]
   workflow_dispatch:

concurrency:
   group: downstream-ci-${{ github.ref }}
   cancel-in-progress: true

permissions:
   contents: read

jobs:
   downstream-contracts:
      name: Downstream policy and contracts
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0
         - uses: actions/setup-node@v4
           with:
              node-version: 24
         - run: node scripts/upstream-sync.mjs check
         - run: node scripts/check-pi-product-docs.mjs
         - run: node scripts/check-pi-phase4-evidence.mjs
         - run: node --test scripts/upstream-sync.test.mjs scripts/check-pi-product-docs.test.mjs scripts/check-pi-phase4-evidence.test.mjs

   source:
      name: Source checks
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.3.14
         - run: bun install --frozen-lockfile
         - run: bun run ci:check:full
         - run: bun test scripts/ci-concurrency.test.ts scripts/fix-dts-extensions.test.ts scripts/link-omp.test.ts

# This fork intentionally has no publication jobs. Immutable pi-v* tags identify source only.
